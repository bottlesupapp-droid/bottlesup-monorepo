name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Flutter apps (user + vendor) + shared package ──
  flutter:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap (pub get all)
        run: melos bootstrap

      - name: Analyze all Flutter packages
        run: melos run analyze:all

      - name: Run tests
        run: melos run test:all

  # ── Admin panel (React + Vite) ──
  admin:
    name: Admin Panel Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bottles-up-dashboard-admin-main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/bottles-up-dashboard-admin-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
